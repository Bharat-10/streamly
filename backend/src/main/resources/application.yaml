spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB
  application:
    name: streamly
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/streamly}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
  elasticsearch:
    uris: ${ES_URI:http://localhost:9200}

jwt:
  secret: ${JWT_SECRET:streamly-local-dev-secret-change-me-0123456789abcdef}
  expiration: 900000            # 15 minutes
  refresh-expiration: 604800000 # 7 days

aws:
  region: ${AWS_REGION:ap-south-1}
  s3:
    bucket: ${S3_BUCKET:your-bucket-name}
